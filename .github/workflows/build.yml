name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      seadrive_version: ${{ steps.v.outputs.seadrive_version }}
      seadroid_version: ${{ steps.v.outputs.seadroid_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - id: v
        run: |
          echo "version=$(nix eval --raw .#packages.x86_64-linux.seafile-client.version)" >> "$GITHUB_OUTPUT"
          echo "seadrive_version=$(nix eval --raw .#packages.x86_64-linux.seadrive-gui.version)" >> "$GITHUB_OUTPUT"
          echo "seadroid_version=$(nix eval --raw .#packages.x86_64-linux.seadroid-src.version)" >> "$GITHUB_OUTPUT"

  # Applies every nix/patches/*.patch against its pinned upstream tag and
  # builds nothing else. Cheap (no compiler involved) and runs before any of
  # the expensive jobs below, so a patch that's bitrotted against a version
  # bump fails in seconds instead of minutes into a Qt/Gradle build.
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix build .#packages.x86_64-linux.patches-check

  appimage:
    needs: [version, patches]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SEADRIVE_VERSION: ${{ needs.version.outputs.seadrive_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build Seafile AppImage
        run: nix build .#packages.${{ matrix.system }}.seafile-appimage
      - run: |
          cp result "seafile-${VERSION}-${{ matrix.arch }}.AppImage"
          sha256sum "seafile-${VERSION}-${{ matrix.arch }}.AppImage" > "seafile-${VERSION}-${{ matrix.arch }}.AppImage.sha256"
      - name: Build SeaDrive AppImage
        run: nix build .#packages.${{ matrix.system }}.seadrive-appimage
      - run: |
          cp result "seadrive-${SEADRIVE_VERSION}-${{ matrix.arch }}.AppImage"
          sha256sum "seadrive-${SEADRIVE_VERSION}-${{ matrix.arch }}.AppImage" > "seadrive-${SEADRIVE_VERSION}-${{ matrix.arch }}.AppImage.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            seafile-${{ env.VERSION }}-${{ matrix.arch }}.AppImage
            seafile-${{ env.VERSION }}-${{ matrix.arch }}.AppImage.sha256
            seadrive-${{ env.SEADRIVE_VERSION }}-${{ matrix.arch }}.AppImage
            seadrive-${{ env.SEADRIVE_VERSION }}-${{ matrix.arch }}.AppImage.sha256

  # macOS .dmg. Apple Silicon (aarch64-darwin) only — GitHub's `macos-latest`
  # hosted runners are M-series, and that's the only macOS system this flake
  # builds for (see the `systems` list in flake.nix; there's no x86_64-darwin
  # output to confuse this with).
  dmg:
    needs: [version, patches]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix build .#packages.aarch64-darwin.seafile-dmg
      - run: |
          cp result "seafile-${VERSION}-aarch64.dmg"
          shasum -a 256 "seafile-${VERSION}-aarch64.dmg" > "seafile-${VERSION}-aarch64.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: |
            seafile-${{ env.VERSION }}-aarch64.dmg
            seafile-${{ env.VERSION }}-aarch64.dmg.sha256

  # Builds the Android APK. Gradle resolves dependencies from Maven at build
  # time, so — unlike every other job here — this isn't a hermetic `nix
  # build`: Nix only provisions the JDK + Android SDK/NDK/CMake (reproducibly
  # pinned, see nix/android.nix); `nix develop .#android` puts those on PATH
  # and Gradle does the rest with normal network access.
  #
  # Signing is required, not optional: this job fails immediately if the
  # ANDROID_KEYSTORE_BASE64 repo secret (and friends) aren't set, rather than
  # silently shipping an unsigned build under the Seafile name. For local
  # testing without a key, use `nix run .#seadroid-debug-apk` instead — see
  # README.md's Android section for both.
  android:
    needs: [version, patches]
    runs-on: ubuntu-latest
    env:
      SEADROID_VERSION: ${{ needs.version.outputs.seadroid_version }}
    steps:
      - name: Require Android signing secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::Android release signing secrets are not fully set (need ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Refusing to publish an unsigned build under the Seafile name. See README.md's Android section to generate and set a release key, or use 'nix run .#seadroid-debug-apk' locally without one."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Fetch patched source
        run: |
          nix build .#packages.x86_64-linux.seadroid-src -o seadroid-src
          cp -rL seadroid-src seadroid-build
          chmod -R u+w seadroid-build
      - name: Set up release signing
        working-directory: seadroid-build/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > key.properties <<EOF
          keyStore=release.keystore
          keyStorePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
      - name: Build release APK
        working-directory: seadroid-build
        run: |
          nix develop .. .#android -c ./gradlew assembleRelease --console=plain
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "../seadroid-${SEADROID_VERSION}.apk"
      - run: sha256sum "seadroid-${SEADROID_VERSION}.apk" > "seadroid-${SEADROID_VERSION}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            seadroid-${{ env.SEADROID_VERSION }}.apk
            seadroid-${{ env.SEADROID_VERSION }}.apk.sha256

  # Every build publishes its own release; the newest is marked "Latest"
  # automatically. Nothing is ever overwritten. The release is always titled
  # plain "Seafile" — version info lives in the tag and the checksummed
  # filenames, not the title.
  release:
    needs: [version, appimage, dmg, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create release
        run: |
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"

          printf '## Checksums\n```\n' > notes.md
          cat dist/*.sha256 >> notes.md
          printf '```\n' >> notes.md

          gh release create "$TAG" \
            --title "Seafile" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes-file notes.md \
            dist/*.AppImage dist/*.dmg dist/*.apk dist/*.sha256
